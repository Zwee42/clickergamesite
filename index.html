<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="left-panel">
            <h2>Owned Upgrades</h2>
            <div id="owned-upgrades" class="owned-upgrades"></div>
        </div>

        <div class="center-panel">
            <div id="active-effects" class="active-effects"></div>
            <h1>Cookie Clicker</h1>
            <div class="score-board">
                <p>Cookies: <span id="cookie-count">0</span></p>
                <p>per second: <span id="cookies-per-second">0</span></p>
            </div>
            <div class="cookie-container">
                <div class="cookie-glow"></div>
                <div id="cursor-circle" class="cursor-circle"></div>
                <div class="cookie-wrapper">
                    <button id="the-cookie" class="cookie-btn"><img src="img/cookiev3.png" alt="Cookie"></button>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="tab-bar">
                <button class="tab-btn tab-btn--active" data-tab="buildings">Buildings</button>
                <button class="tab-btn" data-tab="upgrades">Upgrades</button>
                <button class="tab-btn" data-tab="achievements">Ach.</button>
                <button class="tab-btn" data-tab="stats">Stats</button>
                <button class="tab-btn" data-tab="settings">Settings</button>
            </div>

            <div class="tab-content tab-content--active" id="tab-buildings">
                <div class="bulk-bar">
                    <button class="bulk-btn" data-mode="0">x1</button>
                    <button class="bulk-btn" data-mode="1">x10</button>
                    <button class="bulk-btn" data-mode="2">x100</button>
                    <button class="bulk-btn" data-mode="3">Max</button>
                </div>
                <div id="shop"></div>
                <div id="cps-breakdown" class="cps-breakdown"></div>
                <button id="prestige-btn" class="upgrade-btn upgrade-btn--small upgrade-btn--special">Prestige (Reset)</button>
            </div>

            <div class="tab-content" id="tab-upgrades">
                <div id="upgrade-shop"></div>
            </div>

            <div class="tab-content" id="tab-achievements">
                <h3>Achievements</h3>
                <div id="achievements-list" class="achievements-list"></div>
            </div>

            <div class="tab-content" id="tab-stats">
                <h3>Statistics</h3>
                <div id="stats-content" class="stats-content"></div>
            </div>

            <div class="tab-content" id="tab-settings">
                <h3>Settings</h3>
                <div id="settings-content" class="settings-content"></div>
            </div>
        </div>
    </div>
    <script src="js/state.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
